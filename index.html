<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>3D Roblox-Style Game Fix</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 140px;
            height: 140px;
            pointer-events: auto;
        }
        #jump-btn {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 85px;
            height: 85px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        #jump-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.92);
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            padding: 10px 16px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="joystick-zone"></div>
        <div id="jump-btn">NHẢY</div>
        <div id="instructions">
            🕹️ <b>Cần trái:</b> Di chuyển nhân vật<br>
            🖐️ <b>Vuốt phải:</b> Xoay Camera mượt 360°<br>
            🦘 <b>Nút NHẢY:</b> Nhảy lên không trung
        </div>
        <div id="stats-panel">
            FPS: <span id="fps-counter">60</span><br>
            POS: <span id="pos-counter">X: 0, Z: 0</span>
        </div>
    </div>

    <script>
        let scene, camera, renderer, clock;
        let playerGroup, playerMeshGroup, playerBodyParts = {};
        let isGrounded = true;
        let velocityY = 0;
        const gravity = -32.0;
        const jumpForce = 13.5;
        const moveSpeed = 12.0;

        let cameraTargetAngleX = 0;
        let cameraTargetAngleY = 0.35;
        let cameraCurrentAngleX = 0;
        let cameraCurrentAngleY = 0.35;
        const cameraDistance = 14.0;
        const cameraDamping = 0.08;

        let joystickVector = { x: 0, y: 0 };
        let isRightTouchActive = false;
        let lastTouchX = 0;
        let lastTouchY = 0;
        let activeTouchId = null;

        let animTime = 0;
        let isMoving = false;

        function initEngine() {
            clock = new THREE.Clock();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7ec0ee);
            scene.fog = new THREE.FogExp2(0x7ec0ee, 0.0035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('game-container').appendChild(renderer.domElement);

            setupLighting();
            createEnvironment();
            createPlayer();
            setupControls();

            window.addEventListener('resize', onWindowResize, false);
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(ambientLight);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.35);
            hemiLight.position.set(0, 200, 0);
            scene.add(hemiLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.85);
            sunLight.position.set(80, 150, 60);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);
        }

        function createEnvironment() {
            const groundGeo = new THREE.PlaneGeometry(2000, 2000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x55aa55, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createPlayer() {
            playerGroup = new THREE.Group();
            playerGroup.position.set(0, 0, 15);
            scene.add(playerGroup);

            playerMeshGroup = new THREE.Group();
            playerGroup.add(playerMeshGroup);

            const loader = new THREE.GLTFLoader();
            loader.load('roblox-noob.glb',
                (gltf) => {
                    const model = gltf.scene;
                    model.scale.set(1.5, 1.5, 1.5);
                    
                    // Nâng model lên đúng độ cao thực tế để không chìm xuống mặt đất
                    const box = new THREE.Box3().setFromObject(model);
                    model.position.y = -box.min.y;

                    model.traverse(child => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    playerMeshGroup.add(model);
                },
                undefined,
                () => { buildProceduralRobloxNoob(); }
            );
        }

        // Dựng nhân vật Procedural chính xác tâm Y không bao giờ bị lún đất
        function buildProceduralRobloxNoob() {
            const yellowMat = new THREE.MeshStandardMaterial({ color: 0xFFE042, roughness: 0.4 });
            const blueMat   = new THREE.MeshStandardMaterial({ color: 0x0000FF, roughness: 0.4 });
            const greenMat  = new THREE.MeshStandardMaterial({ color: 0x00FF00, roughness: 0.4 });

            // 1. Chân Trái
            const leftLegGeo = new THREE.BoxGeometry(0.9, 2.0, 1.0);
            leftLegGeo.translate(0, 1.0, 0); // Đưa gốc tọa độ về đáy chân
            const leftLeg = new THREE.Mesh(leftLegGeo, greenMat);
            leftLeg.position.set(-0.5, 0, 0);
            leftLeg.castShadow = true;
            playerMeshGroup.add(leftLeg);
            playerBodyParts.leftLeg = leftLeg;

            // 2. Chân Phải
            const rightLegGeo = new THREE.BoxGeometry(0.9, 2.0, 1.0);
            rightLegGeo.translate(0, 1.0, 0);
            const rightLeg = new THREE.Mesh(rightLegGeo, greenMat);
            rightLeg.position.set(0.5, 0, 0);
            rightLeg.castShadow = true;
            playerMeshGroup.add(rightLeg);
            playerBodyParts.rightLeg = rightLeg;

            // 3. Thân Dưới/Trên
            const torsoGeo = new THREE.BoxGeometry(2.0, 2.0, 1.0);
            const torso = new THREE.Mesh(torsoGeo, blueMat);
            torso.position.set(0, 3.0, 0);
            torso.castShadow = true;
            playerMeshGroup.add(torso);

            // 4. Tay Trái
            const leftArmGeo = new THREE.BoxGeometry(0.9, 2.0, 1.0);
            leftArmGeo.translate(0, -1.0, 0);
            const leftArm = new THREE.Mesh(leftArmGeo, yellowMat);
            leftArm.position.set(-1.5, 4.0, 0);
            leftArm.castShadow = true;
            playerMeshGroup.add(leftArm);
            playerBodyParts.leftArm = leftArm;

            // 5. Tay Phải
            const rightArmGeo = new THREE.BoxGeometry(0.9, 2.0, 1.0);
            rightArmGeo.translate(0, -1.0, 0);
            const rightArm = new THREE.Mesh(rightArmGeo, yellowMat);
            rightArm.position.set(1.5, 4.0, 0);
            rightArm.castShadow = true;
            playerMeshGroup.add(rightArm);
            playerBodyParts.rightArm = rightArm;

            // 6. Đầu
            const headGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const head = new THREE.Mesh(headGeo, yellowMat);
            head.position.set(0, 4.6, 0);
            head.castShadow = true;
            playerMeshGroup.add(head);
        }

        function setupControls() {
            const joystick = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static',
                position: { left: '70px', bottom: '70px' },
                color: 'white',
                size: 110
            });

            joystick.on('move', (evt, data) => {
                if (data.vector) {
                    // SỬA LỖI JOYSTICK NGƯỢC: Đảo ngược chiều Y của NippleJS
                    joystickVector.x = data.vector.x;
                    joystickVector.y = -data.vector.y; 
                    isMoving = true;
                }
            });

            joystick.on('end', () => {
                joystickVector.x = 0;
                joystickVector.y = 0;
                isMoving = false;
            });

            // Touch xoay camera
            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.clientX > window.innerWidth / 2 && activeTouchId === null) {
                        activeTouchId = touch.identifier;
                        isRightTouchActive = true;
                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!isRightTouchActive) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === activeTouchId) {
                        const deltaX = touch.clientX - lastTouchX;
                        const deltaY = touch.clientY - lastTouchY;

                        cameraTargetAngleX -= deltaX * 0.006;
                        cameraTargetAngleY += deltaY * 0.006;
                        cameraTargetAngleY = Math.max(0.08, Math.min(Math.PI / 2.1, cameraTargetAngleY));

                        lastTouchX = touch.clientX;
                        lastTouchY = touch.clientY;
                    }
                }
            }, { passive: false });

            const resetTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        isRightTouchActive = false;
                        activeTouchId = null;
                    }
                }
            };

            window.addEventListener('touchend', resetTouch);
            window.addEventListener('touchcancel', resetTouch);

            // Nút nhảy
            const jumpBtn = document.getElementById('jump-btn');
            const performJump = (e) => {
                if (e) e.preventDefault();
                if (isGrounded) {
                    velocityY = jumpForce;
                    isGrounded = false;
                }
            };
            jumpBtn.addEventListener('touchstart', performJump, { passive: false });
            jumpBtn.addEventListener('mousedown', performJump);
        }

        function updatePlayerAnimation(delta) {
            if (!playerBodyParts.leftArm) return;

            if (isMoving && isGrounded) {
                animTime += delta * 12;
                playerBodyParts.leftArm.rotation.x  = Math.sin(animTime) * 0.7;
                playerBodyParts.rightArm.rotation.x = -Math.sin(animTime) * 0.7;
                playerBodyParts.leftLeg.rotation.x  = -Math.sin(animTime) * 0.7;
                playerBodyParts.rightLeg.rotation.x = Math.sin(animTime) * 0.7;
            } else {
                playerBodyParts.leftArm.rotation.x  = THREE.MathUtils.lerp(playerBodyParts.leftArm.rotation.x, 0, 0.15);
                playerBodyParts.rightArm.rotation.x = THREE.MathUtils.lerp(playerBodyParts.rightArm.rotation.x, 0, 0.15);
                playerBodyParts.leftLeg.rotation.x  = THREE.MathUtils.lerp(playerBodyParts.leftLeg.rotation.x, 0, 0.15);
                playerBodyParts.rightLeg.rotation.x = THREE.MathUtils.lerp(playerBodyParts.rightLeg.rotation.x, 0, 0.15);
            }
        }

        let frameCount = 0;
        let lastFpsUpdate = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            frameCount++;
            if (clock.getElapsedTime() - lastFpsUpdate >= 1.0) {
                document.getElementById('fps-counter').textContent = frameCount;
                frameCount = 0;
                lastFpsUpdate = clock.getElapsedTime();
            }

            // Vật lý trọng lực
            playerGroup.position.y += velocityY * delta;

            if (!isGrounded) {
                velocityY += gravity * delta;
            }

            // Đảm bảo bàn chân luôn đứng đúng chuẩn Y = 0
            if (playerGroup.position.y <= 0) {
                playerGroup.position.y = 0;
                velocityY = 0;
                isGrounded = true;
            }

            // Di chuyển nhân vật chuẩn theo góc Camera
            if (joystickVector.x !== 0 || joystickVector.y !== 0) {
                const moveAngle = Math.atan2(joystickVector.x, joystickVector.y);
                const totalAngle = cameraCurrentAngleX + moveAngle;

                const moveX = Math.sin(totalAngle) * moveSpeed * delta;
                const moveZ = Math.cos(totalAngle) * moveSpeed * delta;

                playerGroup.position.x += moveX;
                playerGroup.position.z += moveZ;

                playerMeshGroup.rotation.y = totalAngle;
            }

            document.getElementById('pos-counter').textContent = `X: ${playerGroup.position.x.toFixed(1)}, Z: ${playerGroup.position.z.toFixed(1)}`;

            // Làm mượt camera xoay
            cameraCurrentAngleX += (cameraTargetAngleX - cameraCurrentAngleX) * cameraDamping;
            cameraCurrentAngleY += (cameraTargetAngleY - cameraCurrentAngleY) * cameraDamping;

            const camX = playerGroup.position.x + cameraDistance * Math.sin(cameraCurrentAngleX) * Math.cos(cameraCurrentAngleY);
            const camY = playerGroup.position.y + cameraDistance * Math.sin(cameraCurrentAngleY) + 2.5;
            const camZ = playerGroup.position.z + cameraDistance * Math.cos(cameraCurrentAngleX) * Math.cos(cameraCurrentAngleY);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 2.8, playerGroup.position.z);

            updatePlayerAnimation(delta);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', initEngine);
        window.addEventListener('load', () => { animate(); });
    </script>
</body>
</html>
